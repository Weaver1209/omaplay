[package]
name = "omaplay"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Fast, themed libmpv video player for Omarchy and Arch Linux"

[[bin]]
name = "omaplay"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
gdk4 = "0.11"
gio = "0.22"
glib = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
